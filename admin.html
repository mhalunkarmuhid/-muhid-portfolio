<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Portfolio Admin</title>
<style>
  :root {
    --bg: #0b0b0e; --card: #16161b; --border: #2a2a32; --fg: #f1f1ec;
    --muted: #9a9aa5; --accent: #6c7cff; --danger: #ff6b6b; --ok: #38d996;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px; max-width: 860px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, textarea, select {
    width: 100%; background: #0e0e12; border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    cursor: pointer; border: none; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 12px; padding: 6px 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .item {
    background: #0e0e12; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-top: 10px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 12px;
  }
  .item-title { font-weight: 600; font-size: 14px; }
  .item-desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  #gate { max-width: 360px; margin: 80px auto; text-align: center; }
  #app { display: none; }
</style>
</head>
<body>

  <div id="gate">
    <h1>Admin Login</h1>
    <p class="sub">Enter your admin password to edit the portfolio.</p>
    <input type="password" id="passwordInput" placeholder="Password" autofocus />
    <div class="row" style="justify-content:center">
      <button class="btn-primary" id="loginBtn">Unlock</button>
    </div>
    <div class="status err" id="loginStatus"></div>
  </div>

  <div id="app">
    <h1>Portfolio Admin</h1>
    <p class="sub">Add achievements (hackathons, internships, prizes, ranks) and extra projects. Changes go live on the site after you click Save.</p>

    <div class="card">
      <h2 style="margin:0 0 4px;font-size:16px;">Achievements</h2>
      <label>Tag <span style="font-weight:400;color:var(--muted)">(e.g. "Hackathon · Winner", "Internship")</span></label>
      <input id="achTag" placeholder="Hackathon · 1st Runner-up" />
      <label>Title</label>
      <input id="achTitle" placeholder="Smart India Hackathon 2026" />
      <label>Description</label>
      <textarea id="achDesc" placeholder="Built X in 36 hours, won ₹50,000 prize pool, ranked 2nd out of 200 teams."></textarea>
      <div class="row">
        <button class="btn-primary" id="addAchBtn">+ Add Achievement</button>
      </div>
      <div id="achList"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 4px;font-size:16px;">Extra Projects</h2>
      <label>Title</label>
      <input id="projTitle" placeholder="Project name" />
      <label>Category</label>
      <input id="projCategory" placeholder="AI Product, Web App, etc." />
      <label>Tagline</label>
      <input id="projTagline" placeholder="One-line hook" />
      <label>Description</label>
      <textarea id="projDesc" placeholder="What it does, what you built."></textarea>
      <label>Tech (comma-separated)</label>
      <input id="projTech" placeholder="React, Node.js, MongoDB" />
      <div class="row">
        <button class="btn-primary" id="addProjBtn">+ Add Project</button>
      </div>
      <div id="projList"></div>
    </div>

    <div class="row">
      <button class="btn-primary" id="saveBtn" style="padding:12px 28px;">Save Changes to Live Site</button>
      <span class="status" id="saveStatus"></span>
    </div>
  </div>

<script>
  let adminPassword = '';
  let achievements = [];
  let projects = [];

  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const loginStatus = document.getElementById('loginStatus');

  document.getElementById('loginBtn').addEventListener('click', unlock);
  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlock();
  });

  function unlock() {
    const val = document.getElementById('passwordInput').value.trim();
    if (!val) return;
    adminPassword = val;
    gate.style.display = 'none';
    app.style.display = 'block';
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      achievements = data.achievements || [];
      projects = data.projects || [];
      renderAchievements();
      renderProjects();
    } catch (e) {
      // start empty if fetch fails
    }
  }

  function renderAchievements() {
    const list = document.getElementById('achList');
    list.innerHTML = '';
    achievements.forEach((a, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div>
          <div class="item-title">${escapeHtml(a.title)} <span style="color:var(--accent);font-weight:400;font-size:12px;">${escapeHtml(a.tag || '')}</span></div>
          <div class="item-desc">${escapeHtml(a.desc || '')}</div>
        </div>
        <button class="btn-danger" data-i="${i}">Remove</button>`;
      el.querySelector('button').addEventListener('click', () => {
        achievements.splice(i, 1);
        renderAchievements();
      });
      list.appendChild(el);
    });
  }

  function renderProjects() {
    const list = document.getElementById('projList');
    list.innerHTML = '';
    projects.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div>
          <div class="item-title">${escapeHtml(p.title)} <span style="color:var(--accent);font-weight:400;font-size:12px;">${escapeHtml(p.category || '')}</span></div>
          <div class="item-desc">${escapeHtml(p.tagline || '')}</div>
        </div>
        <button class="btn-danger" data-i="${i}">Remove</button>`;
      el.querySelector('button').addEventListener('click', () => {
        projects.splice(i, 1);
        renderProjects();
      });
      list.appendChild(el);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('addAchBtn').addEventListener('click', () => {
    const tag = document.getElementById('achTag').value.trim();
    const title = document.getElementById('achTitle').value.trim();
    const desc = document.getElementById('achDesc').value.trim();
    if (!title) return;
    achievements.push({ tag, title, desc });
    document.getElementById('achTag').value = '';
    document.getElementById('achTitle').value = '';
    document.getElementById('achDesc').value = '';
    renderAchievements();
  });

  document.getElementById('addProjBtn').addEventListener('click', () => {
    const title = document.getElementById('projTitle').value.trim();
    const category = document.getElementById('projCategory').value.trim();
    const tagline = document.getElementById('projTagline').value.trim();
    const description = document.getElementById('projDesc').value.trim();
    const tech = document.getElementById('projTech').value.trim();
    if (!title) return;
    projects.push({ title, category, tagline, description, tech });
    document.getElementById('projTitle').value = '';
    document.getElementById('projCategory').value = '';
    document.getElementById('projTagline').value = '';
    document.getElementById('projDesc').value = '';
    document.getElementById('projTech').value = '';
    renderProjects();
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('saveStatus');
    statusEl.textContent = 'Saving...';
    statusEl.className = 'status';
    try {
      const res = await fetch('/api/data', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword,
        },
        body: JSON.stringify({ achievements, projects }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed.');
      statusEl.textContent = 'Saved! It\'s now live on your site.';
      statusEl.className = 'status ok';
    } catch (e) {
      statusEl.textContent = e.message;
      statusEl.className = 'status err';
    }
  });
</script>
</body>
</html>
